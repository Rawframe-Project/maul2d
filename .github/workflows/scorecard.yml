name: scorecard

# OpenSSF Scorecard: grades the repository's security practices and publishes
# the result for the README badge. Kept in each repository because publishing
# requires the workflow to run from the repository it grades.

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 9 * * 0"
  workflow_dispatch:

# Scorecard's publishing rejects a workflow with top-level env or defaults,
# so this is the one workflow without defaults.run.shell.
permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
