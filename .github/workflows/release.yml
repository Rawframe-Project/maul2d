name: release

# release-please keeps a release pull request open from conventional commits.
# Merging it tags vX.Y.Z and creates the GitHub release; the assets job then
# builds the source archive, writes its checksum and an SBOM, attests where
# it was built, and attaches all of it to the release.
# docs/operations/release.md has the steps.

on:
  push:
    branches: [main]
  # Runs again by hand after a failed push run, without a new commit.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release (vX.Y.Z) to build and attach the files of
        required: false
        default: ""

# Every job sets the least it needs.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Both steps act with the app token, so github.token needs no permissions here.
    permissions: {}
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # The Rawframe Release app's token, not github.token, so the release pull
      # request runs CI: GitHub starts no workflows for pull requests github.token opens.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Only what release-please uses: the release commit and tag, the
          # release pull request, and its labels.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    # A tag given by hand, from the default branch, attaches the files to a
    # release made outside this run, also when release-please fails in it: the
    # Release app cannot create a release on a commit whose workflows differ
    # from the default branch's head, so the maintainer creates it instead.
    if: ${{ !cancelled() && ((inputs.tag != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (needs.release-please.result == 'success' && needs.release-please.outputs.created == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      # A run that both creates a release and is given another tag takes neither.
      # The attestation names this workflow on the default branch, so the files
      # must come from a commit the default branch holds: a tag pushed on any
      # other commit is refused. A release that already has files keeps them;
      # nothing here replaces a published file. The files are built from the
      # commit checked here, never from the tag read again, which could have
      # moved in between.
      - name: A release tag
        id: tag
        env:
          CREATED: ${{ needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          [ -z "$CREATED" ] || [ "$CREATED" = "$TAG" ] || { echo "release-please created $CREATED, not $TAG"; exit 1; }
          commit=$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)
          held=$(gh api "repos/$REPO/compare/$commit...refs/heads/$DEFAULT" --jq .status)
          [ "$held" = ahead ] || [ "$held" = identical ] || { echo "$TAG names $commit, which $DEFAULT does not hold"; exit 1; }
          files=$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets | length')
          [ "$files" = 0 ] || { echo "$TAG already has $files files"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.commit }}
          persist-credentials: false
      - name: The checked commit
        env:
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: '[ "$(git rev-parse HEAD)" = "$COMMIT" ] || { echo "checked out $(git rev-parse HEAD), not $COMMIT"; exit 1; }'
      - name: Build the release files into dist/
        # The library ships as source, like every Maul library: the tagged
        # tree is all a build needs. GitHub's own source archives are not
        # promised byte-stable; this one is checksummed and attested.
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="${GITHUB_REPOSITORY#*/}-${TAG#v}/" -o "dist/${GITHUB_REPOSITORY#*/}-${TAG#v}.tar.gz" HEAD
      # Without a source name syft names the document after its path, ".".
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SOURCE_NAME: ${{ github.event.repository.name }}
          SYFT_SOURCE_VERSION: ${{ env.TAG }}
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*
