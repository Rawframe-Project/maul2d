# Publishes the documentation site to GitHub Pages: the README, the user
# documentation, the API reference generated from the headers and the
# changelog, built by tools/build_docs.py, and the testbed compiled to
# WebAssembly at testbed/.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Documentation
        run: |
          pip install markdown==3.6
          python tools/build_docs.py
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      # Single-threaded on purpose: Pages sends no COOP/COEP headers, so
      # SharedArrayBuffer is unavailable in the browser.
      - name: WebAssembly testbed
        run: |
          emcmake cmake -B out/web-testbed -DCMAKE_BUILD_TYPE=Release -DMAUL2D_BUILD_TESTBED=ON \
            -DMAUL2D_BUILD_TESTS=OFF -DMAUL2D_BUILD_SAMPLES=OFF -DMAUL2D_BUILD_BENCH=OFF \
            -DMAUL2D_BUILD_TOOLS=OFF
          cmake --build out/web-testbed --target testbed -j 4
          mkdir -p _site/testbed
          cp out/web-testbed/testbed/testbed.html _site/testbed/index.html
          cp out/web-testbed/testbed/testbed.js out/web-testbed/testbed/testbed.wasm _site/testbed/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
