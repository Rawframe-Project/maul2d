# Continuous integration for the Maul family. This file is the same in
# maul2d and maul3d except for the env block below.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: runner toolchain updates must not move a single bit, and
    # the long soak and deep fuzz run here.
    - cron: '17 3 * * 1'

env:
  LIB: maul2d
  PREFIX: MAUL2D
  HASH_PREFIX: M2
  # Engine-specific flags for the sanitizer cell.
  SANITIZE_FLAGS: "-DMAUL2D_VALIDATE=ON -DMAUL2D_SIMD=scalar"

jobs:
  # Every platform cell builds with warnings as errors, runs the whole
  # suite and uploads the determinism hashes it printed.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gcc,          os: ubuntu-latest,    cc: gcc,   config: Release }
          - { name: linux-x64-clang,        os: ubuntu-latest,    cc: clang, config: Release }
          - { name: linux-x64-clang-debug,  os: ubuntu-latest,    cc: clang, config: Debug }
          - { name: linux-arm64-gcc,        os: ubuntu-24.04-arm, cc: gcc,   config: Release }
          - { name: linux-arm64-clang,      os: ubuntu-24.04-arm, cc: clang, config: Release }
          - { name: macos-arm64-clang,      os: macos-latest,     cc: clang, config: Release }
          - { name: windows-x64-msvc,       os: windows-latest,   cc: cl,    config: Release }
          - { name: windows-x64-msvc-debug, os: windows-latest,   cc: cl,    config: Debug }
          - { name: windows-arm64-msvc,     os: windows-11-arm,   cc: cl,    config: Release }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.cc }}" = "cl" ]; then
            cmake -B build -D${PREFIX}_WERROR=ON
          else
            cmake -B build -D${PREFIX}_WERROR=ON -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
              -DCMAKE_C_COMPILER=${{ matrix.cc }}
          fi
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -j 4
      - name: Test
        shell: bash
        run: ctest --test-dir build -C ${{ matrix.config }} -V --output-on-failure | tee out.txt
      - name: Extract hashes
        shell: bash
        run: grep -oE "${HASH_PREFIX}_[A-Z0-9_]+_HASH=[0-9a-f]{16}" out.txt | sort -u > "hash-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.name }}
          path: hash-${{ matrix.name }}.txt

  sanitize:
    name: asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build -D${PREFIX}_WERROR=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang \
            -D${PREFIX}_SANITIZE=ON ${SANITIZE_FLAGS}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build -V --output-on-failure | tee out.txt
      - name: Extract hashes
        run: grep -oE "${HASH_PREFIX}_[A-Z0-9_]+_HASH=[0-9a-f]{16}" out.txt | sort -u > hash-sanitize.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hash-sanitize
          path: hash-sanitize.txt

  tsan:
    name: thread sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -D${PREFIX}_WERROR=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -D${PREFIX}_TSAN=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  wasm:
    name: wasm-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # Pinned like every toolchain: an update announces itself
          # through a red build, not a silent drift.
          version: 6.0.2
      - name: Configure
        run: |
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-pthread" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread -sPTHREAD_POOL_SIZE=8 -sINITIAL_MEMORY=536870912 -sSTACK_SIZE=8388608 -sDEFAULT_PTHREAD_STACK_SIZE=8388608 -sENVIRONMENT=node -sEXIT_RUNTIME=1" \
            -D${PREFIX}_BUILD_SAMPLES=OFF -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build -V --output-on-failure | tee out.txt
      - name: Extract hashes
        run: grep -oE "${HASH_PREFIX}_[A-Z0-9_]+_HASH=[0-9a-f]{16}" out.txt | sort -u > hash-wasm-node.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hash-wasm-node
          path: hash-wasm-node.txt

  # Every cell must print exactly the same hashes, and they must match
  # the values committed in test/hashes.txt.
  compare-hashes:
    name: cross-platform hash equality
    needs: [build-test, sanitize, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: hashes
          pattern: hash-*
          merge-multiple: true
      - name: Compare the cells with each other
        shell: bash
        run: |
          CELLS=$(ls hashes/*.txt | wc -l)
          cat hashes/*.txt | sort | uniq -c | awk -v n="$CELLS" '$1 != n' > divergent.txt
          if [ -s divergent.txt ]; then
            echo "DETERMINISM FAILURE: these lines are not printed by all $CELLS cells:"
            cat divergent.txt
            exit 1
          fi
          echo "all $CELLS cells printed identical hashes"
          cat hashes/*.txt > all-hashes.txt
      - name: Compare with test/hashes.txt
        run: python3 tools/check_hashes.py --file all-hashes.txt

  shared:
    name: shared library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -D${PREFIX}_WERROR=ON -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_BUILD_SHARED=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Installs the library and builds samples/minimal against the
  # installed package alone.
  package:
    name: package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build and install
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_BUILD_TESTS=OFF
          cmake --build build --config Release -j 4
          cmake --install build --config Release --prefix "$PWD/pkg"
      - name: Build the consumer against the install
        shell: bash
        run: |
          cmake -S samples/minimal -B consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/pkg"
          cmake --build consumer --config Release
      - name: Run it
        shell: bash
        run: |
          if [ -f consumer/Release/minimal.exe ]; then
            PATH="$PWD/pkg/bin:$PATH" consumer/Release/minimal.exe
          else
            consumer/minimal
          fi
      - name: pkg-config sees the package
        if: runner.os == 'Linux'
        run: PKG_CONFIG_PATH="$PWD/pkg/lib/pkgconfig" pkg-config --exists --print-errors "$LIB"

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          pip install clang-format==22.1.5 >/dev/null
          clang-format --version
          clang-format --dry-run -Werror $(find include src test bench samples tools testbed \
            \( -name '*.c' -o -name '*.h' \) 2>/dev/null)

  rules:
    name: source rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Functions and files within their limits or listed with a reason
        run: python3 tools/check_lengths.py
      - name: No development-history markers in comments
        run: python3 tools/check_comments.py

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          pip install clang-tidy==22.1.0 >/dev/null
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          for f in src/*.c; do
            clang-tidy -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  docs:
    name: generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The API reference matches the headers
        run: |
          COUNT=$(python3 tools/gen_api.py | grep -oE '\([0-9]+ functions\)' | grep -oE '[0-9]+')
          git diff --exit-code docs/api.md || { echo "docs/api.md is stale: run tools/gen_api.py"; exit 1; }
          grep -q "$COUNT public functions" README.md || { echo "README says the wrong function count ($COUNT)"; exit 1; }

  bench-pins:
    name: bench pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4 --target ${LIB}_bench
      - name: Compare with bench/pins.txt
        shell: bash
        run: |
          ./build/${LIB}_bench | tee bench.out
          fail=0
          while read -r scene pin; do
            if ! grep -q "${HASH_PREFIX}_BENCH $scene .*hash=$pin" bench.out; then
              echo "PIN MOVED: $scene expected $pin"
              fail=1
            fi
          done < bench/pins.txt
          exit $fail

  testbed:
    name: testbed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_BUILD_TESTBED=ON
          cmake --build build -j 4 --target testbed

  # The shared family files must match the sibling repository. Scheduled
  # rather than per push, because the two repositories are pushed one
  # after the other.
  family-sync:
    name: family files in sync
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the sibling
        shell: bash
        run: |
          if [ "$LIB" = "maul2d" ]; then SIBLING=maul3d; else SIBLING=maul2d; fi
          fail=0
          for f in $(cat tools/family-files.txt); do
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository_owner }}/$SIBLING/main/$f" -o sibling.tmp || { echo "missing in $SIBLING: $f"; fail=1; continue; }
            cmp -s "$f" sibling.tmp || { echo "differs from $SIBLING: $f"; fail=1; }
          done
          exit $fail

  soak:
    name: weekly soak
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4 --target test_soak test_fuzz
      - name: Long soak
        run: ./build/test_soak 300000
      - name: Deep fuzz
        run: ./build/test_fuzz 200
