# Continuous integration: the pull request check, and the full check on
# main and every night, which simulates and fuzzes longer. Each build cell
# is a CMake preset built by the organization's shared workflow; the other
# jobs run in the same CI image. Every test cell checks the determinism
# hashes against test/hashes.txt (the golden test), so all cells agree on
# every bit.
# docs/operations/checks.md explains each job, and tools/check.sh runs the
# Linux ones locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL2D

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@595e1c52a0fae00e49974c5152a7a6f3ed39753c # v0.0.28
    permissions:
      pull-requests: read

  # The organization's documentation check, run from the pinned commit of
  # .github.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rawframe-Project/.github/.github/actions/docs-check@595e1c52a0fae00e49974c5152a7a6f3ed39753c # v0.0.28

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@595e1c52a0fae00e49974c5152a7a6f3ed39753c # v0.0.28
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length and snippet checks, test hygiene and labels, the documentation
  # site, and clang-tidy with the assertions compiled out and live. It runs
  # on documentation changes too, since the snippet check and the site read
  # docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          clang-format --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          files=$(git ls-files 'include/*.h' 'src/*.[ch]' 'test/*.[ch]' 'tools/*.[ch]' 'bench/*.[ch]' \
            'samples/*.[ch]' 'testbed/*.[ch]')
          [ -n "$files" ] || { echo "::error::no files to format"; exit 1; }
          echo "$files" | xargs clang-format --dry-run -Werror
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
          python3 tools/check_float_env.py
      # Every test registration, in the configurations that add tests: the
      # shared build adds the package test.
      - name: Test hygiene
        run: |
          python3 tools/check_test_hygiene.py --self-test
          python3 tools/check_test_hygiene.py
          cmake -B out/hygiene -G Ninja -DCMAKE_C_COMPILER=clang-20 >/dev/null
          cmake -B out/hygiene-shared -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_BUILD_SHARED=ON \
            -D${PREFIX}_TEST_PACKAGE=ON >/dev/null
          python3 tools/check_test_hygiene.py --ctest out/hygiene --ctest out/hygiene-shared
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      # clang-tidy twice: on the Release preset, where the assertions
      # compile out, and with them live. Each hides findings the other
      # shows: a value read only by an assertion is a dead store once it
      # compiles out, and a live assertion's branches count toward a
      # function's complexity.
      - name: clang-tidy, assertions compiled out
        run: |
          cmake --preset linux-clang-20 -B out/tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMAUL2D_BUILD_TESTS=OFF -DMAUL2D_BUILD_BENCH=OFF -DMAUL2D_BUILD_SAMPLES=OFF
          files=$(git ls-files 'src/*.c')
          [ -n "$files" ] || { echo "::error::no files for clang-tidy"; exit 1; }
          echo "$files" | xargs -P "$(nproc)" -n 1 clang-tidy-20 -p out/tidy --quiet --warnings-as-errors='*'
      - name: clang-tidy, assertions live
        run: |
          cmake --preset linux-clang-20 -B out/tidy-asserts -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DMAUL2D_BUILD_TESTS=OFF -DMAUL2D_BUILD_BENCH=OFF \
            -DMAUL2D_BUILD_SAMPLES=OFF
          files=$(git ls-files 'src/*.c')
          [ -n "$files" ] || { echo "::error::no files for clang-tidy"; exit 1; }
          echo "$files" | xargs -P "$(nproc)" -n 1 clang-tidy-20 -p out/tidy-asserts --quiet \
            --warnings-as-errors='*'

  # Every cell builds with warnings as errors and runs the whole suite, the
  # golden test and the header tests included: x86-64 with the AVX2
  # backend, arm64 with NEON, and the scalar backend under the sanitizers.
  # The shared cell also installs the library and builds samples/minimal
  # against it (the "package" test).
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: linux-i686-gcc-14 }
          - { preset: linux-i686-clang-20 }
          - { preset: linux-arm64-gcc-14, runner: ubuntu-24.04-arm }
          - { preset: linux-arm64-clang-20, runner: ubuntu-24.04-arm }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
          - { preset: windows-arm64-clang-cl, runner: windows-11-arm }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@595e1c52a0fae00e49974c5152a7a6f3ed39753c # v0.0.28
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}

  # The interactive testbed, which is not part of the library: it must keep
  # building against the public API.
  testbed:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@595e1c52a0fae00e49974c5152a7a6f3ed39753c # v0.0.28
    permissions:
      contents: read
    with:
      preset: linux-testbed
      test: false

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # The library and its tests under Emscripten and Node with threads, the
  # golden test included, and the size of the static library. The CI image
  # has no Emscripten, so this job uses the runner and the emsdk action.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Build
        run: |
          cmake --preset web-emscripten
          cmake --build --preset web-emscripten -j 4
      - name: Test
        run: |
          ctest --preset web-emscripten | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-emscripten
          path: out/web-emscripten/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - name: Size
        run: ls -l out/web-emscripten/libmaul2d.a

  # Each fuzz target feeds hostile snapshots, tapes and points, or drives
  # the API walk, and crashes on a broken promise: 20 seconds on a pull
  # request, 90 on main and 600 at night or on a dispatch, where the walk,
  # whose inputs are slow and distinct, takes 3600. One job per
  # target, each with its own corpus cache: restored by every run but a
  # pull request's (the newest of that target's), minimized with
  # libFuzzer's merge and saved from main when the run found nothing. A
  # pull request starts from the inputs the targets build. tools/fuzz_target.sh reports a finding
  # without its input, and no finding, log or corpus is uploaded.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (matrix.target == 'fuzz_walk' && 75 || 25) || 15 }}
    # The image cpp.yml uses; --init reaps orphaned processes.
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_snapshot, fuzz_journal, fuzz_geometry, fuzz_walk]
    env:
      TARGET: ${{ matrix.target }}
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 20 || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (matrix.target == 'fuzz_walk' && 3600 || 600) || 90) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches are immutable: each run saves a new entry and the next run
      # restores the latest.
      - name: Restore the corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Build
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz --target "$TARGET"
      - name: Run
        run: |
          mkdir -p "out/corpus/$TARGET"
          rm -rf out/fuzz-reports
          status=0
          tools/fuzz_target.sh "out/fuzz/$TARGET" -max_total_time="$FUZZ_SECONDS" -max_len=4096 \
            "out/corpus/$TARGET" || status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          exit "$status"
      # The corpus is merged into a fresh directory and swapped in only when
      # the merge finished without a finding, so a failed merge leaves the
      # old corpus. tools/fuzz_target.sh keeps the merge's log on the runner;
      # a finding's kind and sanitizer report are printed as Run prints them.
      - name: Minimize the corpus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "out/merged/$TARGET"
          rm -rf out/fuzz-reports
          status=0
          tools/fuzz_target.sh --merge "out/fuzz/$TARGET" "out/merged/$TARGET" "out/corpus/$TARGET" ||
            status=$?
          if [ "$status" -ne 0 ]; then
            cat "out/fuzz-reports/$TARGET.txt" 2>/dev/null || true
            exit "$status"
          fi
          rm -rf "out/corpus/$TARGET" && mv "out/merged/$TARGET" "out/corpus/$TARGET"
          echo "$TARGET: $(find "out/corpus/$TARGET" -type f | wc -l) inputs, $(du -sm "out/corpus/$TARGET" | cut -f1) MB"
      - name: Save the corpus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

  # Every night: the seeded API walk over many more seeds, and a long soak
  # of one world, both checking replay, rollback and threaded twins. Not a
  # pull request check: it takes longer than the budget allows.
  simulation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset linux-clang-20 >/dev/null
          cmake --build --preset linux-clang-20
      # The tests the required runs leave out: a failed one is a known
      # flake and a warning, anything else fails the step. The runner gives
      # each test the presets' 300 seconds, so a hung test is reported
      # instead of cancelling the job.
      - name: Quarantined tests
        run: tools/run_quarantine.sh out/linux-clang-20
      - name: Long soak
        run: ./out/linux-clang-20/test_soak 300000
      - name: Deep API walk
        run: ./out/linux-clang-20/test_walk 200

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped for a documentation-only change, so adding or
  # renaming a job never touches the ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, testbed, msvc-headers, web, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
