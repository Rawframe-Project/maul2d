# Continuous integration: the pull request check, and the full check on
# main and every night, which simulates and fuzzes longer. Each build cell
# is a CMake preset built by the organization's shared workflow; the other
# jobs run in the same CI image. Every test cell checks the determinism
# hashes against test/hashes.txt (the golden test), so all cells agree on
# every bit.
# docs/operations/checks.md explains each job, and tools/check.sh runs the
# Linux ones locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL2D

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@e6b9db735576653736d19d9c50d47e1b428af77a # v0.0.22
    permissions:
      pull-requests: read

  # The organization's documentation check, run from the pinned commit of
  # .github.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rawframe-Project/.github/.github/actions/docs-check@e6b9db735576653736d19d9c50d47e1b428af77a # v0.0.22

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@e6b9db735576653736d19d9c50d47e1b428af77a # v0.0.22
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length and snippet checks, test hygiene and labels, the documentation
  # site, and clang-tidy. It runs on documentation changes too, since the
  # snippet check and the site read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.6@sha256:50c383f608f992c272196139d749f15978e35143a2876362b1e0aef6993480bd
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          clang-format --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          files=$(git ls-files 'include/*.h' 'src/*.[ch]' 'test/*.[ch]' 'tools/*.[ch]' 'bench/*.[ch]' \
            'samples/*.[ch]' 'testbed/*.[ch]')
          [ -n "$files" ] || { echo "::error::no files to format"; exit 1; }
          echo "$files" | xargs clang-format --dry-run -Werror
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
          python3 tools/check_float_env.py
      # Every test registration, in the configurations that add tests: the
      # shared build adds the package test.
      - name: Test hygiene
        run: |
          python3 tools/check_test_hygiene.py --self-test
          python3 tools/check_test_hygiene.py
          cmake -B out/hygiene -G Ninja -DCMAKE_C_COMPILER=clang-20 >/dev/null
          cmake -B out/hygiene-shared -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_BUILD_SHARED=ON \
            -D${PREFIX}_TEST_PACKAGE=ON >/dev/null
          python3 tools/check_test_hygiene.py --ctest out/hygiene --ctest out/hygiene-shared
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: clang-tidy
        run: |
          cmake -B out/tidy -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMAUL2D_BUILD_TESTS=OFF -DMAUL2D_BUILD_BENCH=OFF -DMAUL2D_BUILD_SAMPLES=OFF
          files=$(git ls-files 'src/*.c')
          [ -n "$files" ] || { echo "::error::no files for clang-tidy"; exit 1; }
          echo "$files" | xargs -P "$(nproc)" -n 1 clang-tidy-20 -p out/tidy --quiet --warnings-as-errors='*'

  # Every cell builds with warnings as errors and runs the whole suite, the
  # golden test and the header tests included: x86-64 with the AVX2
  # backend, arm64 with NEON, and the scalar backend under the sanitizers.
  # The shared cell also installs the library and builds samples/minimal
  # against it (the "package" test).
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: linux-arm64-gcc-14, runner: ubuntu-24.04-arm }
          - { preset: linux-arm64-clang-20, runner: ubuntu-24.04-arm }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
          - { preset: windows-arm64-clang-cl, runner: windows-11-arm }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@e6b9db735576653736d19d9c50d47e1b428af77a # v0.0.22
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}

  # The interactive testbed, which is not part of the library: it must keep
  # building against the public API.
  testbed:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@e6b9db735576653736d19d9c50d47e1b428af77a # v0.0.22
    permissions:
      contents: read
    with:
      preset: linux-testbed
      test: false

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # The library and its tests under Emscripten and Node with threads, the
  # golden test included, and the size of the static library. The CI image
  # has no Emscripten, so this job uses the runner and the emsdk action.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Build
        run: |
          cmake --preset web-emscripten
          cmake --build --preset web-emscripten -j 4
      - name: Test
        run: |
          ctest --preset web-emscripten | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-emscripten
          path: out/web-emscripten/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - name: Size
        run: ls -l out/web-emscripten/libmaul2d.a

  # Each fuzz target feeds hostile snapshots, tapes and points, or drives
  # the API walk, and crashes on a broken promise: briefly on a pull
  # request, longer on main and at night.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The image cpp.yml uses; --init reaps orphaned processes.
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.6@sha256:50c383f608f992c272196139d749f15978e35143a2876362b1e0aef6993480bd
      options: --init
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 20 || (github.event_name == 'push' && 90 || 900) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz
      - name: Run
        # Four targets at a time, one per core of the runner; each keeps its
        # full time. A target's output goes to its log, printed when it
        # finds something.
        run: |
          mkdir -p out/fuzz-logs
          fuzz_one() {
            name=$(basename "$1")
            mkdir -p "out/corpus/$name"
            if "$1" -max_total_time="$FUZZ_SECONDS" -max_len=4096 "out/corpus/$name" \
              >"out/fuzz-logs/$name.log" 2>&1; then
              echo "$name: no finding"
            else
              tail -n 60 "out/fuzz-logs/$name.log"
              echo "::error::$name found something"
              return 1
            fi
          }
          export -f fuzz_one
          printf '%s\n' out/fuzz/fuzz_* | xargs -P 4 -I {} bash -c 'fuzz_one "$1"' _ {}
      - name: Fuzz logs and crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz
          path: |
            out/fuzz-logs/
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore
          retention-days: 7

  # Every night: the seeded API walk over many more seeds, and a long soak
  # of one world, both checking replay, rollback and threaded twins. Not a
  # pull request check: it takes longer than the budget allows.
  simulation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.6@sha256:50c383f608f992c272196139d749f15978e35143a2876362b1e0aef6993480bd
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset linux-clang-20 >/dev/null
          cmake --build --preset linux-clang-20 --target test_soak test_walk
      - name: Long soak
        run: ./out/linux-clang-20/test_soak 300000
      - name: Deep API walk
        run: ./out/linux-clang-20/test_walk 200

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped for a documentation-only change, so adding or
  # renaming a job never touches the ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, testbed, msvc-headers, web, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
