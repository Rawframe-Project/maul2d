# The pull request title becomes the commit on main and the changelog
# line, so it must be a conventional commit with one of the scopes
# AGENTS.md lists.
name: pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@6ce8dd114cb71948ce6a28dd7b122cb9f4514e0b # v0.0.38
    permissions:
      pull-requests: read
    with:
      scopes: api world collision solver joints fluid query geometry journal snapshot simd testbed samples build bench family
