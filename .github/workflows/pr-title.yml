# The pull request title becomes the commit on main and the changelog
# line, so it must be a conventional commit with one of the scopes
# AGENTS.md lists.
name: pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@6880b317526459b0a1032bebd8a7bdec4148af23 # v0.0.7
    permissions:
      pull-requests: read
    with:
      scopes: world collision solver joints fluid query geometry journal snapshot simd testbed samples build bench family
