# Closes a pull request from outside the organization unless it closes an
# issue labeled `accepted`, as CONTRIBUTING.md asks. It reads the pull
# request through the API and never checks out its code.
name: pull request gate

# pull_request_target gives the gate a token that can close the pull
# request; the shared workflow never checks out or runs the pull request's
# code, which is what makes the trigger dangerous elsewhere.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, edited]

permissions: {}

jobs:
  gate:
    uses: Rawframe-Project/.github/.github/workflows/pr-gate.yml@3044ba71d36f3e3eb370b8915ca1b02f337fda8c # v0.0.41
    permissions:
      pull-requests: write
      issues: read
